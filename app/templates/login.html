<!DOCTYPE html>
<html>
<head>
  <title>Login - Ride Demand System</title>
  <style>
    body { font-family: Arial; background: #f0f2f5; display: flex;
           justify-content: center; align-items: center; height: 100vh; }
    form { background: white; padding: 30px; border-radius: 8px;
           box-shadow: 0 2px 8px rgba(0,0,0,.15); width: 280px; }
    input, button { width: 100%; padding: 10px; margin-top: 10px;
                    box-sizing: border-box; }
    button { background: #1a73e8; color: white; border: none; cursor: pointer; }
    .error { color: red; margin-top: 10px; }
  </style>
</head>
<body>
  <form method="POST">
    <h2>Ride Demand System</h2>
    <input name="username" placeholder="Username" required>
    <input name="password" type="password" placeholder="Password" required>
    <button type="submit">Login</button>
    {% with messages = get_flashed_messages() %}
      {% for m in messages %}<div class="error">{{ m }}</div>{% endfor %}
    {% endwith %}
  </form>
</body>
</html>
